      //Print one to Twenty (1 ~ 20)
      /*
      Step 1: Start
      Step 2: Declare X and Assign 0
      Step 3: Increment X

      // for (let i = 1; i <= 20; i++) {

      function printNumbers(n) {
        console.log(n);

      function convertFtoC(Fahrenheit)
      {
        return (Fahrenheit-32) * 5 /9;
