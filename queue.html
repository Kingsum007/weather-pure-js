    <script>
        //FIFO (First in First Out)
      let queue = [];
      //enqueue
      queue.push("A"); //Index 0
      queue.push("B");  // After Shift Index 0
      queue.push("C");
      console.log("Enqueue");
      console.log(queue);
      //Dequeue
      queue.shift(); //Reindex
      console.log("Dequeue");
      console.log(queue);

      class Queue{
        constructor(){
            this.items =[];
            this.front =0;
            this.rear = 0;
        }
        enqueue(element)
        {
            this.items[this.rear] = element;
            this.rear++;
        }

        dequeue()
        {
            if(this.isEmpty()) return null;
            const item = this.items[this.front];
            this.front++;
            return item;
        }
        peek()
        {
            return this.isEmpty() ? null : this.items[this.front];
        }
        isEmpty()
        {
            return this.rear - this.front === 0;
        }


        print()
        {
            console.log(this.items);
        }
      }
