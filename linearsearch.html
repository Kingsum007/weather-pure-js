  //O(Log n)
      function binarySearch(arr, target) {
        let left = 0;
        let right = arr.length;
        while (left <= right) {
          let mid = Math.floor((left + right) / 2);
          if (arr[mid] === target) {
            return mid;
          }

          if (arr[mid] < target) {
            left = mid + 1;
          } else {
            right = mid + 1;
          }
        }
        return -1;
      }

      let arr1 = [1, 3, 5, 7, 9, 11];
      let result1 = binarySearch(arr1, 7);
      if (result1 !== -1) {
        console.log("Result Found at " + result1);
      } else {
        console.log("Not Found");
      }

      //Recursive
