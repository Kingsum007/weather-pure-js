<!DOCTYPE html>

    <title>GCD</title>
  </head>
  <body>
    <div id="out">The Greatest Common Divisor | GCD</div>
    <script>
      // let a, b;
      // Algorithm Swapping
      function gcd(a, b) {
        while (b !== 0) {
          let temp = b;
          b = a % b;
          a = temp;
        }
        return a;
      }
      //   document.getElementById("out").innerHTML = gcd(30,12);

      // Recursion
      function gcd1(a, b) {
        if (b === 0) return a;
        return gcd1(b, a % b);
      }
      //   document.getElementById("out").innerHTML = gcd1(75, 25);

      function gcd2(a, b, c) {
        let gcdValue = 1;
        for (let i = 1; i <= Math.min(a, b, c); i++) {
          if (a % i === 0 && b % i === 0 && c % i === 0) {
            gcdValue = i;
          }
        }
        return gcdValue;
      }
      document.getElementById("out").innerHTML += ": " + gcd2(45, 160, 120);
